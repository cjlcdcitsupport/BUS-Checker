<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bus Checker</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --brand:#1f3a68; --err:#c5221f; --bg:#f4f6fa; --card:#fff; --ink:#1d2433; --muted:#6b7385; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif; background:var(--bg); color:var(--ink); font-size:17px; }
  header { background:var(--brand); color:#fff; padding:16px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:480px; margin:18px auto; padding:0 14px 40px; }
  .card { background:var(--card); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px #0001; }
  h2 { font-size:18px; margin:0 0 6px; }
  p.hint { color:var(--muted); margin:0 0 12px; font-size:15px; }
  button { width:100%; padding:18px; font-size:19px; border:0; border-radius:12px; background:var(--brand); color:#fff; cursor:pointer; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); font-size:16px; padding:12px; }
  button:disabled { opacity:.5; }
  input { width:100%; padding:14px; font-size:18px; border:1px solid #cfd6e4; border-radius:12px; margin-bottom:10px; }
  #reader { width:100%; border-radius:12px; overflow:hidden; margin-top:12px; }
  .hidden { display:none !important; }
  .sep { text-align:center; color:var(--muted); font-size:14px; margin:14px 0; }
  .msg { margin-top:12px; padding:12px; border-radius:10px; background:#fce8e6; color:var(--err); font-size:15px; }
  .menu-btn { margin-bottom:14px; padding:22px; }
  .menu-btn small { display:block; font-size:14px; font-weight:400; opacity:.85; margin-top:4px; }
  .menu-btn.alt { background:#fff; color:var(--brand); border:2px solid var(--brand); }
  .menu-btn.alt small { color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Bus Checker: รถรับ-ส่งพนักงาน CDC</h1>
</header>

<main>
  <!-- Step 1: choose -->
  <section id="menu">
    <button class="menu-btn" id="btnGoCheckin">
      ขึ้นรถ / พขร.
      <small>สแกน QR ประจำรถเพื่อบันทึกการขึ้นรถ หรือเริ่มรอบวิ่ง</small>
    </button>
    <button class="menu-btn alt" id="btnGoAdmin">
      ผู้ดูแลระบบ
      <small>จัดการรถ พนักงาน QR และดูรายงาน</small>
    </button>
  </section>

  <!-- Step 2: check-in path -->
  <section id="checkinSection" class="hidden">
    <button class="ghost" id="btnBack" style="margin-bottom:14px">← กลับหน้าเลือก</button>

    <div class="card">
      <h2>สแกน QR ประจำรถ</h2>
      <p class="hint">สแกนป้าย QR ที่ติดบนรถ</p>
      <button id="btnScan">เปิดกล้องสแกน QR</button>
      <div id="reader" class="hidden"></div>
      <button id="btnStop" class="ghost hidden" style="margin-top:10px">ปิดกล้อง</button>
      <div class="sep">หรือ</div>
      <h2>พิมพ์รหัสรถ</h2>
      <input id="vehicleInput" placeholder="เช่น TEST-BUS01" autocomplete="off" autocapitalize="characters">
      <button class="ghost" id="btnManual">ไปหน้าบันทึก</button>
      <div id="msg" class="msg hidden"></div>
    </div>
  </section>
</main>

<script>
  var CHECKIN_PAGE = 'checkin.html';
  var ADMIN_PAGE = 'admin.html';
  var scanner = null;

  function $(id) { return document.getElementById(id); }

  function showError(text) {
    var m = $('msg');
    m.textContent = text;
    m.classList.remove('hidden');
  }

  function showSection(name) {
    $('menu').classList.toggle('hidden', name !== 'menu');
    $('checkinSection').classList.toggle('hidden', name !== 'checkin');
    $('msg').classList.add('hidden');
  }

  // Accept raw ID or a full URL containing ?v=
  function extractVehicleId(text) {
    var s = String(text || '').trim();
    try {
      var u = new URL(s);
      var v = u.searchParams.get('v');
      if (v) return v.trim().toUpperCase();
    } catch (e) { /* not a URL */ }
    return s.toUpperCase().replace(/\s+/g, '');
  }

  function goCheckin(vehicleId) {
    if (!vehicleId) return showError('กรุณาระบุรหัสรถ');
    location.href = CHECKIN_PAGE + '?v=' + encodeURIComponent(vehicleId);
  }

  async function stopScanner() {
    if (scanner) {
      try { await scanner.stop(); } catch (e) { /* already stopped */ }
      try { scanner.clear(); } catch (e) { /* ignore */ }
      scanner = null;
    }
    $('reader').classList.add('hidden');
    $('btnStop').classList.add('hidden');
  }

  $('btnGoCheckin').addEventListener('click', function () { showSection('checkin'); });
  $('btnGoAdmin').addEventListener('click', function () { location.href = ADMIN_PAGE; });
  $('btnBack').addEventListener('click', async function () {
    await stopScanner();
    showSection('menu');
  });

  $('btnScan').addEventListener('click', async function () {
    $('msg').classList.add('hidden');
    if (typeof Html5Qrcode === 'undefined') {
      return showError('โหลดตัวสแกนไม่สำเร็จ กรุณาพิมพ์รหัสรถแทน');
    }
    $('reader').classList.remove('hidden');
    $('btnStop').classList.remove('hidden');
    scanner = new Html5Qrcode('reader');
    try {
      await scanner.start(
        { facingMode: 'environment' },
        { fps: 10, qrbox: 240 },
        function (decodedText) {
          var id = extractVehicleId(decodedText);
          stopScanner().then(function () { goCheckin(id); });
        },
        function () { /* per-frame decode errors are normal; ignore */ }
      );
    } catch (e) {
      await stopScanner();
      showError('เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง หรือพิมพ์รหัสรถแทน');
    }
  });

  $('btnStop').addEventListener('click', stopScanner);

  $('btnManual').addEventListener('click', function () {
    goCheckin(extractVehicleId($('vehicleInput').value));
  });

  $('vehicleInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') $('btnManual').click();
  });

  // Old QR links with ?v= go straight to the check-in page
  (function forwardOldLinks() {
    var params = new URLSearchParams(location.search);
    var v = params.get('v');
    if (v) {
      var role = params.get('role');
      var qs = '?v=' + encodeURIComponent(v.trim().toUpperCase()) + (role ? '&role=' + encodeURIComponent(role) : '');
      location.replace(CHECKIN_PAGE + qs);
    }
  })();
</script>
</body>
</html>
