<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bus Checker Admin</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script><style>
:root{--brand:#1f3a68;--brand2:#2f5aa3;--ok:#1e8e3e;--warn:#e0a800;--err:#c5221f;--bg:#f4f6fa;--ink:#1d2433;--muted:#6b7385;--line:#dbe2ef}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun','Noto Sans Thai','Noto Sans Myanmar',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
body.lang-my{line-height:1.8}
header{background:var(--brand);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{color:#fff;text-decoration:none;background:#ffffff26;border:1px solid #ffffff55;border-radius:22px;padding:7px 14px;font-size:16px;white-space:nowrap;cursor:pointer;font-family:inherit}
.langs{display:flex;gap:4px}
.langs button{background:#ffffff1f;color:#fff;border:1px solid #ffffff55;border-radius:14px;padding:3px 10px;font-size:13px;white-space:nowrap;line-height:1.8;cursor:pointer}
.langs button.on{background:#fff;color:var(--brand)}
main{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}
.big{display:block;width:100%;padding:18px;font-size:21px;font-weight:700;border:0;border-radius:16px;background:var(--brand2);color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
.big.green{background:var(--ok)} .big.orange{background:#d9822b}
.big:disabled{opacity:.5}
.btn{padding:11px 16px;font-size:16px;border:0;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.small{padding:5px 10px;font-size:13px}
.hidden{display:none!important}
label.f{display:block;font-weight:600;margin:12px 0 6px}
input[type=text],input[type=password],input[type=date],select{width:100%;padding:13px;font-size:18px;border:2px solid #cfd6e4;border-radius:12px;font-family:inherit}
.plate{font-size:34px;font-weight:800;color:var(--brand);line-height:1.2}
.route{color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:#e3ebfa;color:var(--brand);border-radius:20px;padding:4px 12px;font-size:15px;white-space:nowrap}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{flex:1;min-width:90px;padding:14px 10px;font-size:19px;border:2px solid #cfd6e4;background:#fff;border-radius:12px;cursor:pointer;font-family:inherit;white-space:nowrap}
.rounds button.on{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700}
.warn{background:#fff7e0;border-left:5px solid var(--warn);padding:12px 14px;border-radius:0 10px 10px 0;margin-bottom:14px}
.err{background:#fce8e6;color:var(--err);padding:12px 14px;border-radius:10px;margin-top:12px}
.list button{display:block;width:100%;text-align:left;padding:14px;margin-bottom:8px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:17px;cursor:pointer;font-family:inherit}
.list b{color:var(--brand)}
.photo{display:flex;align-items:center;gap:12px}
.photo img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
#ov{position:fixed;inset:0;background:var(--ok);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#ov .tick{font-size:96px;line-height:1}
#ov h2{margin:8px 0;font-size:28px} #ov p{margin:4px 0;font-size:20px}
#ov button{margin-top:24px;padding:14px 36px;font-size:20px;border:0;border-radius:30px;background:#fff;color:var(--ok);font-weight:700;cursor:pointer;font-family:inherit}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d2433;color:#fff;padding:10px 16px;border-radius:8px;font-size:15px;z-index:60}
.muted{color:var(--muted)} a.lnk{color:var(--brand2);cursor:pointer;text-decoration:underline}
.spin{text-align:center;padding:30px;color:var(--muted)}

.wide{max-width:1150px;margin:0 auto;padding:12px 14px 50px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{padding:10px 16px;font-size:16px;border:1px solid #cfd6e4;background:#fff;color:var(--brand);border-radius:22px;cursor:pointer;font-family:inherit}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.live{font-size:13px;color:var(--muted);margin-bottom:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#1e8e3e;margin-right:4px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{padding:8px 18px;border:1px solid #cfd6e4;background:#fff;border-radius:18px;font-size:15px;cursor:pointer;font-family:inherit}.seg button.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 4px #0001}.kpi b{display:block;font-size:30px;color:var(--brand);line-height:1.2}.kpi span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:12px}
.ch{position:relative;height:280px}
.card h3{margin:0 0 8px;font-size:16px}
.frm{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.frm label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.frm input,.frm select,#esearch{padding:9px 10px;font-size:15px;border:1px solid #cfd6e4;border-radius:8px;min-width:130px;width:auto}
#esearch{width:100%}
.tw{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #e6e9f0;white-space:nowrap;font-size:15px}th{color:var(--muted);font-size:13px;background:#f8f9fc;position:sticky;top:0}
.bd{padding:2px 10px;border-radius:12px;font-size:13px}.bd.o{background:#e8f5ec;color:var(--ok)}.bd.a{background:#e3ebfa;color:var(--brand)}.bd.r{background:#eee;color:#777}
.trip{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 3px #0001}
.trip .h{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.trip .h b{font-size:17px}
.trip details{margin-top:6px}.trip summary{cursor:pointer;color:var(--brand2)}.trip a{color:var(--brand2)}
#topv{background:linear-gradient(135deg,#fff8e1,#fff);border-left:5px solid var(--warn)}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}
 .qr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8mm}.qr-card{border:2px solid #000;padding:8mm;text-align:center;break-inside:avoid;font-size:20pt;line-height:1.4}
 .qr-card img{width:72mm;height:72mm;image-rendering:pixelated}.qr-card .pl{font-size:30pt;font-weight:800}.qr-card .sm{font-size:14pt;color:#333}}
</style></head><body>
<header><a class="back" href="index.html">← <span>กลับ</span></a><h1>ผู้ดูแลระบบ</h1><button class="back hidden" id="bOut" onclick="logout()">ออก</button></header>

<div id="login"><main>

<div id="app" class="hidden">

   <div class="card"><h3>สรุปแต่ละคัน</h3><div class="tw"><table id="vtab"></table></div></div>

  <section id="t_rep" class="hidden">
   <div class="card"><div class="frm">
    <label>จากวันที่<input type="date" id="rf"></label><label>ถึงวันที่<input type="date" id="rt"></label>
    <label>ทะเบียนรถ<select id="rplate" onchange="drawRep()"><option value="">ทุกคัน</option></select></label>
    <button class="btn" onclick="loadRep()">แสดง</button>
    <button class="btn" style="background:#1e8e3e" onclick="xl()">⬇ Excel แยก Trip</button><button class="btn ghost" onclick="csv()">⬇ CSV</button></div>
    <div style="margin-top:10px;font-size:14px"><label style="display:inline-flex;flex-direction:row;gap:6px;align-items:center;color:inherit"><input type="checkbox" id="rsheets" style="min-width:0"> แยกชีตตาม Trip (ไฟล์ Excel: 1 Trip = 1 ชีต)</label>
    &nbsp; <label style="display:inline-flex;flex-direction:row;gap:6px;align-items:center;color:inherit"><input type="checkbox" id="ropen" checked onchange="drawRep()" style="min-width:0"> กางรายชื่อคนขึ้นรถทุก Trip</label></div>
    <div id="rsum" class="muted" style="margin-top:8px"></div></div>
   <div id="replist"></div>
  </section>

  <section id="t_veh" class="hidden">
   <div class="card"><h3>เพิ่มรถ</h3><div class="frm">
    <label>รหัสรถ<input type="text" id="vid"></label><label>ทะเบียน<input type="text" id="vplate"></label>
    <label>ประเภท<input type="text" id="vtype" placeholder="เช่น รถตู้ / รถบัส"></label><label>สาย/เส้นทาง<input type="text" id="vroute"></label>
    <button class="btn" onclick="addVeh()">เพิ่ม</button></div></div>
   <div class="card"><div class="frm" style="justify-content:space-between"><h3 style="margin:0">รถทั้งหมด</h3><button class="btn" onclick="printQR(null)">🖨 พิมพ์ QR ทุกคัน</button></div>
    <div class="tw"><table id="vehtab"></table></div></div>
  </section>

  <section id="t_set" class="hidden">
   <div class="grid2">
   <div class="card"><h3>รอบรถ</h3><div class="frm"><label>ชื่อรอบ<input type="text" id="rname" placeholder="เช่น เช้า"></label><button class="btn" onclick="addRound()">เพิ่มรอบ</button></div>
    <div class="tw"><table id="rtab"></table></div></div>
   <div class="card"><h3>พนักงาน</h3><div class="frm"><label>รหัส<input type="text" id="eid"></label><label>ชื่อ<input type="text" id="ename"></label>
    <label>หน้าที่<select id="erole"><option value="PASSENGER">พนักงาน</option><option value="DRIVER">พขร.</option></select></label><button class="btn" onclick="addEmp()">เพิ่ม</button></div>
    <div style="background:#f4f8ff;border:1px dashed #9db4dc;border-radius:12px;padding:12px;margin:12px 0">
     <b>นำเข้ารายชื่อพนักงานจากไฟล์</b>
     <div style="margin:8px 0"><button class="btn small" onclick="tpl()">⬇ ดาวน์โหลด Template (.xlsx)</button> <span class="muted" style="font-size:13px">กรอกแล้วอัปโหลดกลับได้ (.xlsx / .csv)</span></div>
     <label style="display:block;margin:6px 0"><input type="radio" name="imode" value="append" checked style="min-width:0"> <b>เพิ่มจากของเดิม</b> (ไม่ลบข้อมูลเก่า, รหัสซ้ำจะข้าม)</label>
     <label style="display:block;margin:6px 0"><input type="radio" name="imode" value="replace" style="min-width:0"> <b style="color:#c5221f">แทนที่ทั้งหมด</b> (ลบรายชื่อเก่าทั้งหมดแล้วใส่ใหม่)</label>
     <input type="file" id="ifile" accept=".xlsx,.xls,.csv" onchange="readImp(this)" style="margin:6px 0">
     <div id="iprev" class="muted" style="font-size:14px"></div>
     <button class="btn" id="ibtn" onclick="doImport()" disabled>นำเข้า</button>
    </div>
    <input type="text" id="esearch" placeholder="ค้นหา..." oninput="renderEmp()" style="margin:10px 0">
    <div class="tw" style="max-height:420px"><table id="etab"></table></div></div>
   </div>
  </section>
 </div>
</div>
<div id="printArea"></div>
<script>
var API_URL='https://script.google.com/macros/s/AKfycbyzjO9S6YU0kAoJ4ofO9eiX220sf_p0S4GaV4nvudhTC3D7s3IMda_BSFzSbxAsIuoJSg/exec';
var LANG='th';try{LANG=localStorage.getItem('bc_lang')||'th';}catch(e){}
var CD={
 th:{back:'กลับ',close:'ปิด',loading:'กำลังโหลด...',errNet:'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง',camErr:'เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง',closeCam:'ปิดกล้อง',scanQr:'สแกน QR บนรถ',pickList:'หรือเลือกรถจากรายการ'},
 en:{back:'Back',close:'Close',loading:'Loading...',errNet:'Connection failed. Please retry.',camErr:'Cannot open camera. Please allow camera access.',closeCam:'Close camera',scanQr:'Scan the QR on the bus',pickList:'Or pick a bus from the list'},
 my:{back:'နောက်သို့',close:'ပိတ်မည်',loading:'ခဏစောင့်ပါ...',errNet:'ချိတ်ဆက်၍မရပါ။ ထပ်ကြိုးစားပါ။',camErr:'ကင်မရာဖွင့်မရပါ။ ခွင့်ပြုပေးပါ။',closeCam:'ကင်မရာပိတ်မည်',scanQr:'ကားပေါ်ရှိ QR ကို စကန်ဖတ်ပါ',pickList:'သို့မဟုတ် စာရင်းမှ ကားရွေးပါ'}
};
function t(k){var p=(window.PAGE_DICT||{});var d=(p[LANG]&&p[LANG][k]);if(d==null)d=CD[LANG][k];if(d==null)d=(p.th&&p.th[k]);if(d==null)d=CD.th[k];return d==null?k:d;}
function $(id){return document.getElementById(id);}
function qs(n){return new URLSearchParams(location.search).get(n)||'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function applyLang(){
  document.documentElement.lang=LANG;document.body.classList.toggle('lang-my',LANG==='my');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.getAttribute('data-i'));});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ph]'),function(e){e.placeholder=t(e.getAttribute('data-ph'));});
  Array.prototype.forEach.call(document.querySelectorAll('.langs button'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===LANG);});
  if(window.onLang)onLang();
}
function setLang(l){LANG=l;try{localStorage.setItem('bc_lang',l);}catch(e){}applyLang();}
function apiGet(p){var u=API_URL+'?'+Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]);}).join('&');return fetch(u).then(function(r){return r.json();});}
function apiPost(b){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},3200);}
function compress(file,max){return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    var w=im.width,h=im.height,s=Math.min(1,(max||1280)/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);var url=c.toDataURL('image/jpeg',0.72);res({photo:url.split(',')[1],mime:'image/jpeg',preview:url});};im.src=fr.result;};fr.readAsDataURL(file);});}
var scanner=null;
function startScan(boxId,onCode){
  var box=$(boxId);box.classList.remove('hidden');
  if(!window.Html5Qrcode){toast(t('camErr'));return;}
  scanner=new Html5Qrcode(boxId+'In');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},function(txt){stopScan(boxId);onCode(txt);},function(){}).catch(function(){toast(t('camErr'));box.classList.add('hidden');});
}
function stopScan(boxId){if(scanner){var s=scanner;scanner=null;s.stop().then(function(){s.clear();}).catch(function(){});}$(boxId).classList.add('hidden');}
function vehFromText(txt){txt=String(txt||'').trim();try{var u=new URL(txt);var v=u.searchParams.get('v');if(v)return v;}catch(e){}return txt;}
function showOk(title,lines,btn,after){
  var o=document.createElement('div');o.id='ov';
  o.innerHTML='<div class="tick">✓</div><h2>'+esc(title)+'</h2>'+lines.map(function(l){return '<p>'+esc(l)+'</p>';}).join('')+'<button>'+esc(btn)+'</button>';
  o.querySelector('button').onclick=function(){o.remove();if(after)after();};document.body.appendChild(o);
}
function headerHtml(titleKey){return '<a class="back" href="index.html">← <span data-i="back"></span></a><h1 data-i="'+titleKey+'"></h1><div class="langs"><button data-l="th" onclick="setLang(\'th\')">TH</button><button data-l="en" onclick="setLang(\'en\')">EN</button><button data-l="my" onclick="setLang(\'my\')">မြန်မာ</button></div>';}
</script><script>
var BASE_URL='https://cjlcdcitsupport.github.io/BUS-Checker/passenger.html';
var KEY='';try{KEY=sessionStorage.getItem('bc_key')||'';}catch(e){}
var RANGE=1,TAB='dash',CH={},PAL=['#2f5aa3','#e0a800','#1e8e3e','#c5221f','#7b4fb5','#0e8a9a','#d9822b'];
var VEHS=[],EMPS=[],RNDS=[],META=null,LAST=null;
function today(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Bangkok'});}
function addDays(d,n){var p=d.split('-');var x=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]+n));return x.toISOString().slice(0,10);}
function g(id){return $(id).value.trim();}
function post(b){b.key=KEY;return apiPost(b);}
function getA(p){p.key=KEY;return apiGet(p);}
function doLogin(){
  KEY=$('key').value.trim();if(!KEY)return;
  getA({action:'admin_vehicles'}).then(function(r){
    if(!r.ok){$('lerr').textContent=r.error||'รหัสไม่ถูกต้อง';$('lerr').classList.remove('hidden');return;}
    try{sessionStorage.setItem('bc_key',KEY);}catch(e){}enter(r);
  }).catch(function(){$('lerr').textContent='เชื่อมต่อไม่ได้';$('lerr').classList.remove('hidden');});
}
function logout(){try{sessionStorage.removeItem('bc_key');}catch(e){}location.reload();}
function enter(r){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');$('bOut').classList.remove('hidden');
  VEHS=r.rows;renderVeh();loadSettings();$('rf').value=$('rt').value=today();refresh();
  setInterval(function(){if(!document.hidden)refresh();},10000);
}
document.getElementById('tabs').onclick=function(e){var b=e.target.closest('button');if(!b)return;TAB=b.getAttribute('data-t');
  Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});
  ['dash','rep','veh','set'].forEach(function(k){$('t_'+k).classList.toggle('hidden',k!==TAB);});refresh();};
document.getElementById('rng').onclick=function(e){var b=e.target.closest('button');if(!b)return;RANGE=+b.getAttribute('data-n');

function loadDash(){

  }).catch(function(e){if(String(e.message).indexOf('สิทธิ์')>=0)logout();});

function cnt(arr,fn){var m={};arr.forEach(function(x){var k=fn(x);m[k]=(m[k]||0)+1;});return m;}
function drawDash(){
  var L=LAST,C=L.cur,P=L.prev;
  var rounds=(META&&META.rounds||[]).slice();[C,P].forEach(function(d){d.boards.concat(d.trips).forEach(function(x){if(x.round&&rounds.indexOf(x.round)<0)rounds.push(x.round);});});
  var vset={};C.boards.forEach(function(b){vset[b.veh]=b.plate||b.veh;});C.trips.forEach(function(x){vset[x.veh]=x.plate||x.veh;});
  var vids=Object.keys(vset);
  var perV=vids.map(function(v){var bs=C.boards.filter(function(b){return b.veh===v;});var ts=C.trips.filter(function(x){return x.veh===v;});
    var byR=cnt(bs,function(b){return b.round;});var top='-',tm=0;Object.keys(byR).forEach(function(k){if(byR[k]>tm){tm=byR[k];top=k;}});
    return {id:v,plate:vset[v],n:bs.length,trips:ts.length,byR:byR,top:top};}).sort(function(a,b){return b.n-a.n;});
  var open=C.trips.filter(function(x){return x.status==='OPEN';}).length;
  $('kpis').innerHTML=[[C.boards.length,'คนขึ้นรถทั้งหมด'],[C.trips.length,'รอบวิ่ง'],[vids.length,'รถที่วิ่ง'],[open,'กำลังวิ่งอยู่'],[C.trips.length?(C.boards.length/C.trips.length).toFixed(1):'0','เฉลี่ยคน/รอบ']]

  var best=perV[0];

  var dash=[6,6];
  // c1 rounds
  var cr=cnt(C.boards,function(b){return b.round;}),pr=cnt(P.boards,function(b){return b.round;});
  var cv=rounds.map(function(r){return cr[r]||0;}),pv=rounds.map(function(r){return pr[r]||0;});
  var avg=cv.length?cv.reduce(function(a,b){return a+b;},0)/cv.length:0;
  mk('c1',{type:'bar',data:{labels:rounds,datasets:[
    {label:'ช่วงนี้',data:cv,backgroundColor:PAL[0],order:2},
    {type:'line',label:'ช่วงก่อนหน้า (เส้นประ)',data:pv,borderColor:'#d9822b',borderDash:dash,backgroundColor:'#d9822b',pointRadius:4,tension:.2,order:1},
    {type:'line',label:'ค่าเฉลี่ย (เส้นประ)',data:rounds.map(function(){return +avg.toFixed(2);}),borderColor:'#888',borderDash:[3,5],pointRadius:0,borderWidth:2,order:0}]}});
  // c2 vehicles stacked by round
  var vavg=perV.length?perV.reduce(function(a,b){return a+b.n;},0)/perV.length:0;
  var ds=rounds.map(function(r,i){return {label:r,data:perV.map(function(v){return v.byR[r]||0;}),backgroundColor:PAL[i%PAL.length],stack:'s',order:2};});
  ds.push({type:'line',label:'ค่าเฉลี่ยต่อคัน (เส้นประ)',data:perV.map(function(){return +vavg.toFixed(2);}),borderColor:'#c5221f',borderDash:dash,pointRadius:0,borderWidth:2,order:0});
  mk('c2',{type:'bar',data:{labels:perV.map(function(v){return v.plate;}),datasets:ds},options:{scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});
  // c3 hourly
  function hrs(bs){var a=[];for(var i=0;i<24;i++)a.push(0);bs.forEach(function(b){var h=parseInt(String(b.time).slice(0,2),10);if(h>=0&&h<24)a[h]++;});return a;}
  var hc=hrs(C.boards),hp=hrs(P.boards),lab=[];for(var i=0;i<24;i++)lab.push((i<10?'0':'')+i+':00');
  mk('c3',{type:'line',data:{labels:lab,datasets:[
    {label:'ช่วงนี้',data:hc,borderColor:PAL[0],backgroundColor:'#2f5aa322',fill:true,tension:.3,pointRadius:2},
    {label:'ช่วงก่อนหน้า (เส้นประ)',data:hp,borderColor:'#d9822b',borderDash:dash,tension:.3,pointRadius:0}]}});
  // c4 daily
  $('c4box').classList.toggle('hidden',RANGE<2);
  if(RANGE>=2){var days=[],pdays=[];for(var k=0;k<RANGE;k++){days.push(addDays(L.cf,k));pdays.push(addDays(L.pf,k));}
    var dc=cnt(C.boards,function(b){return b.date;}),dp=cnt(P.boards,function(b){return b.date;});
    var dv=days.map(function(d){return dc[d]||0;}),dpv=pdays.map(function(d){return dp[d]||0;});var da=dv.reduce(function(a,b){return a+b;},0)/dv.length;
    mk('c4',{type:'line',data:{labels:days.map(function(d){return d.slice(5);}),datasets:[
      {label:'ช่วงนี้',data:dv,borderColor:PAL[0],backgroundColor:PAL[0],tension:.25,pointRadius:3},
      {label:'ช่วงก่อนหน้า (เส้นประ)',data:dpv,borderColor:'#d9822b',borderDash:dash,tension:.25,pointRadius:0},
      {label:'ค่าเฉลี่ย (เส้นประ)',data:days.map(function(){return +da.toFixed(2);}),borderColor:'#888',borderDash:[3,5],pointRadius:0}]}});}
  $('vtab').innerHTML='<tr><th>#</th><th>ทะเบียน</th><th>รอบวิ่ง</th><th>คนขึ้นรถ</th><th>เฉลี่ย/รอบ</th><th>รอบที่คนเยอะสุด</th></tr>'+perV.map(function(v,i){return '<tr><td>'+(i+1)+'</td><td><b>'+esc(v.plate)+'</b></td><td>'+v.trips+'</td><td>'+v.n+'</td><td>'+(v.trips?(v.n/v.trips).toFixed(1):'-')+'</td><td>'+esc(v.top)+'</td></tr>';}).join('');
}
function mk(id,cfg){

  cfg.options.plugins={legend:{position:'bottom',labels:{boxWidth:14,font:{size:12}}}};

function flatRows(){

  var mode=document.querySelector('input[name=imode]:checked').value;
  if(mode==='replace'&&!confirm('ยืนยันแทนที่ทั้งหมด?\nรายชื่อพนักงานเดิมทั้งหมดจะถูกลบ แล้วใส่รายชื่อใหม่ '+IMP.length+' รายการ (ย้อนกลับไม่ได้)'))return;
  $('ibtn').disabled=true;$('ibtn').textContent='กำลังนำเข้า...';
  post({action:'importEmployees',mode:mode,rows:IMP}).then(function(r){
    $('ibtn').textContent='นำเข้า';
    if(!r.ok){toast(r.error);$('ibtn').disabled=false;return;}
    toast('นำเข้าแล้ว '+r.added+' รายการ'+(r.skipped?' · ข้าม '+r.skipped:''));IMP=[];$('ifile').value='';$('iprev').textContent='';loadSettings();
  }).catch(function(){$('ibtn').textContent='นำเข้า';$('ibtn').disabled=false;toast('เชื่อมต่อไม่ได้');});
}

if(KEY){getA({action:'admin_vehicles'}).then(function(r){if(r.ok)enter(r);});}
</script></body></html>
