<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bus Checker - ขึ้นรถ</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>
:root{--brand:#1D4DB5;--brand2:#2563D8;--ok:#1F9D63;--red:#D32F2F;--bg:#E4F0FF;--ink:#14284B;--muted:#4A5B78;--line:#C7D3E8;--sh:#2563d826}
*{box-sizing:border-box}
body{margin:0;font-family:'Prompt','Sarabun','Noto Sans Thai','Noto Sans Myanmar',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.55}
body.lang-my{line-height:1.8}
a{color:inherit}
header{background:linear-gradient(135deg,#2B6BE6,#1239A0);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.back{color:#fff;text-decoration:none;background:#ffffff26;border:0;border-radius:24px;min-height:44px;padding:0 16px;font-size:16px;white-space:nowrap;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:4px}
.logo{background:#fff;border-radius:12px;padding:4px 10px;display:flex;align-items:center;flex:none}.logo img{height:24px;display:block}
.langs{display:flex;gap:6px}
header .langs.sub{width:100%;justify-content:flex-end}
.langs button{background:#ffffff1f;color:#fff;border:1px solid #ffffff66;border-radius:18px;min-height:36px;padding:0 14px;font-size:14px;white-space:nowrap;line-height:1.8;cursor:pointer;font-family:inherit}
.langs button.on{background:#fff;color:var(--brand);font-weight:600}
main{max-width:560px;margin:0 auto;padding:16px 16px 20px}
.credit{text-align:center;font-size:12px;color:var(--muted);padding:6px 0 18px}
.card{background:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px var(--sh)}
.big{display:block;width:100%;min-height:66px;padding:16px;font-size:22px;font-weight:700;border:0;border-radius:22px;background:var(--brand2);color:#fff;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 8px 20px #2563d84d;transition:transform .15s,filter .15s}
.big:hover{filter:brightness(1.07)}.big:active{transform:scale(.97)}
.big.green{background:var(--ok);box-shadow:0 8px 20px #1f9d6358}.big.orange{background:var(--red);box-shadow:0 8px 20px #d32f2f55}
.big:disabled{opacity:.5}
.btn{padding:11px 18px;min-height:44px;font-size:16px;border:0;border-radius:12px;background:var(--brand);color:#fff;cursor:pointer;font-family:inherit}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}
.btn.small{padding:5px 12px;min-height:34px;font-size:13px}
.btn:focus-visible,.big:focus-visible,.back:focus-visible,input:focus-visible{outline:3px solid #14284B;outline-offset:2px}
.hidden{display:none!important}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=text],input[type=password],input[type=date],select{width:100%;padding:13px 14px;font-size:19px;border:2px solid var(--line);border-radius:14px;font-family:inherit;color:var(--ink);transition:.15s}
input[type=text]:focus,input[type=password]:focus{border-color:var(--brand2);box-shadow:0 0 0 4px #2563d826;outline:none}
.plate{font-size:40px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:.5px}
.route{color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{background:#E3EBFA;color:var(--brand);border-radius:20px;padding:5px 14px;font-size:15px;white-space:nowrap}
.chip.red{background:#FDE3E3;color:#8E1B1B;font-weight:500}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 1.4s infinite;margin-right:6px}
.rounds{display:flex;gap:8px;flex-wrap:wrap}
.rounds button{flex:1;min-width:90px;min-height:54px;padding:10px;font-size:19px;border:2px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-family:inherit;white-space:nowrap;transition:.15s}
.rounds button.on{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700}
.warn{background:#FDE3E3;border-left:5px solid var(--red);padding:12px 14px;border-radius:0 14px 14px 0;margin-bottom:14px;color:#8E1B1B}
.err{background:#FDE3E3;color:#8E1B1B;padding:12px 14px;border-radius:12px;margin-top:12px}
.list button{display:block;width:100%;text-align:left;min-height:56px;padding:14px;margin-bottom:8px;border:0;background:#fff;border-radius:16px;font-size:17px;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px var(--sh)}
.list b{color:var(--brand)}
.photobtn{width:100%;min-height:112px;border-radius:16px;border:2px dashed #9DB4DC;background:#F4F8FF;color:var(--brand2);font:500 17px inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;transition:.15s}
.photobtn.done{border-color:var(--ok);background:#E6F6EE;color:#17794B;font-weight:600}
.photobtn img{width:92px;height:68px;object-fit:cover;border-radius:10px}
.run{background:linear-gradient(135deg,#2B6BE6,#1239A0);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px var(--sh);overflow:hidden}
.run .chips .chip{background:#ffffff26;color:#fff}
.road{height:4px;margin-top:10px;background-image:repeating-linear-gradient(90deg,#fff 0 20px,transparent 20px 40px);background-size:40px 4px;animation:road .7s linear infinite}
.fadein{opacity:0;animation:up .55s cubic-bezier(.2,.8,.2,1) forwards}
#ov{position:fixed;inset:0;background:var(--ok);color:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;animation:fade .25s}
#ov.blue{background:#1D4DB5}
#ov .ico{position:relative;width:130px;height:130px;margin-bottom:24px}
#ov .rg{position:absolute;inset:0;border-radius:50%;border:3px solid #fff;animation:ring 1.6s ease-out infinite}#ov .rg.r2{animation-delay:.5s}
#ov .tk{position:absolute;inset:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) .1s both}
#ov.blue .tk{background:var(--red)}
#ov .chk{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s ease-out .45s forwards}
#ov h2{margin:0;font-size:30px;opacity:0;animation:rise .5s .7s forwards}
#ov p{margin:6px 0 0;font-size:20px;opacity:0;animation:rise .5s .85s forwards}
#ov button{margin-top:34px;min-height:56px;padding:0 46px;font-size:20px;border:0;border-radius:30px;background:#fff;color:var(--ok);font-weight:700;cursor:pointer;font-family:inherit;opacity:0;animation:rise .5s 1s forwards}
#ov.blue button{color:var(--brand)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14284B;color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;z-index:60}
.muted{color:var(--muted)} a.lnk{color:var(--brand2);cursor:pointer;text-decoration:underline;display:inline-block;min-height:44px;line-height:44px}
.spin{text-align:center;padding:30px;color:var(--muted)}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #1f9d6399}100%{box-shadow:0 0 0 10px #1f9d6300}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes ring{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.4);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes road{from{background-position:0 0}to{background-position:-40px 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
@keyframes spinr{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fadein,#ov h2,#ov p,#ov button{opacity:1!important}#ov .chk{stroke-dashoffset:0}}
</style></head><body><header id="hd"></header><main><div id="scanBox" class="card hidden"><div id="scanBoxIn"></div><button class="btn ghost" style="margin-top:10px" onclick="stopScan('scanBox')" data-i="closeCam"></button></div>
<div id="pick" class="hidden">
 <button class="big" onclick="startScan('scanBox',function(x){go(vehFromText(x));})">📷 <span data-i="scanQr"></span></button>
 <p class="muted" style="text-align:center" data-i="pickList"></p><div id="vlist" class="list"></div>
</div>
<div id="spin" class="spin" data-i="loading"></div>
<div id="car" class="hidden">
 <div class="card fadein"><div id="liveRow" class="muted hidden" style="font-size:14px;color:#17794B;font-weight:500"><span class="live"></span><span data-i="running"></span></div><div class="plate" id="plate"></div><div class="route" id="route"></div>
  <div class="chips" id="chips"></div></div>
 <div id="warn" class="warn hidden" data-i="noTrip"></div>
 <div id="form" class="card hidden fadein" style="animation-delay:.12s">
  <label class="f" for="emp" data-i="empId"></label>
  <input type="text" id="emp" autocomplete="off" autocapitalize="characters" data-ph="empPh">
  <button class="big" id="go" style="margin-top:16px" onclick="board()" data-i="confirm"></button>
  <div id="err" class="err hidden"></div>
 </div>
 <div style="text-align:center"><a class="lnk" onclick="location.href='passenger.html'" data-i="other"></a></div>
</div>
</main><div class="credit">Created by Nutdanai Pathsith</div><script>
var API_URL='https://script.google.com/macros/s/AKfycbyzjO9S6YU0kAoJ4ofO9eiX220sf_p0S4GaV4nvudhTC3D7s3IMda_BSFzSbxAsIuoJSg/exec';
var LANG='th';try{LANG=localStorage.getItem('bc_lang')||'th';}catch(e){}
var CD={
 th:{back:'กลับ',close:'ปิด',loading:'กำลังโหลด...',errNet:'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง',camErr:'เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง',closeCam:'ปิดกล้อง',scanQr:'สแกน QR บนรถ',pickList:'หรือเลือกรถจากรายการ'},
 en:{back:'Back',close:'Close',loading:'Loading...',errNet:'Connection failed. Please retry.',camErr:'Cannot open camera. Please allow camera access.',closeCam:'Close camera',scanQr:'Scan the QR on the bus',pickList:'Or pick a bus from the list'},
 my:{back:'နောက်သို့',close:'ပိတ်မည်',loading:'ခဏစောင့်ပါ...',errNet:'ချိတ်ဆက်၍မရပါ။ ထပ်ကြိုးစားပါ။',camErr:'ကင်မရာဖွင့်မရပါ။ ခွင့်ပြုပေးပါ။',closeCam:'ကင်မရာပိတ်မည်',scanQr:'ကားပေါ်ရှိ QR ကို စကန်ဖတ်ပါ',pickList:'သို့မဟုတ် စာရင်းမှ ကားရွေးပါ'}
};
function t(k){var p=(window.PAGE_DICT||{});var d=(p[LANG]&&p[LANG][k]);if(d==null)d=CD[LANG][k];if(d==null)d=(p.th&&p.th[k]);if(d==null)d=CD.th[k];return d==null?k:d;}
function $(id){return document.getElementById(id);}
function qs(n){return new URLSearchParams(location.search).get(n)||'';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function applyLang(){
  document.documentElement.lang=LANG;document.body.classList.toggle('lang-my',LANG==='my');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i]'),function(e){e.textContent=t(e.getAttribute('data-i'));});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ph]'),function(e){e.placeholder=t(e.getAttribute('data-ph'));});
  Array.prototype.forEach.call(document.querySelectorAll('.langs button'),function(b){b.classList.toggle('on',b.getAttribute('data-l')===LANG);});
  if(window.onLang)onLang();
}
function setLang(l){LANG=l;try{localStorage.setItem('bc_lang',l);}catch(e){}applyLang();}
function apiGet(p){var u=API_URL+'?'+Object.keys(p).map(function(k){return k+'='+encodeURIComponent(p[k]);}).join('&');return fetch(u).then(function(r){return r.json();});}
function apiPost(b){return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(function(r){return r.json();});}
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove();},3200);}
function compress(file,max){return new Promise(function(res,rej){
  var fr=new FileReader();fr.onerror=rej;fr.onload=function(){var im=new Image();im.onerror=rej;im.onload=function(){
    var w=im.width,h=im.height,s=Math.min(1,(max||1280)/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*s);c.height=Math.round(h*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);var url=c.toDataURL('image/jpeg',0.72);res({photo:url.split(',')[1],mime:'image/jpeg',preview:url});};im.src=fr.result;};fr.readAsDataURL(file);});}
var scanner=null;
function startScan(boxId,onCode){
  var box=$(boxId);box.classList.remove('hidden');
  if(!window.Html5Qrcode){toast(t('camErr'));return;}
  scanner=new Html5Qrcode(boxId+'In');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},function(txt){stopScan(boxId);onCode(txt);},function(){}).catch(function(){toast(t('camErr'));box.classList.add('hidden');});
}
function stopScan(boxId){if(scanner){var s=scanner;scanner=null;s.stop().then(function(){s.clear();}).catch(function(){});}$(boxId).classList.add('hidden');}
function vehFromText(txt){txt=String(txt||'').trim();try{var u=new URL(txt);var v=u.searchParams.get('v');if(v)return v;}catch(e){}return txt;}
function showOk(title,lines,btn,after,blue){
  var o=document.createElement('div');o.id='ov';if(blue)o.className='blue';
  o.innerHTML='<div class="ico"><span class="rg"></span><span class="rg r2"></span><div class="tk"><svg width="70" height="70" viewBox="0 0 24 24" fill="none" stroke="'+(blue?'#fff':'#1F9D63')+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="chk" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div></div><h2>'+esc(title)+'</h2>'+lines.map(function(l){return '<p>'+esc(l)+'</p>';}).join('')+'<button>'+esc(btn)+'</button>';
  o.querySelector('button').onclick=function(){o.remove();if(after)after();};document.body.appendChild(o);

$('hd').innerHTML=headerHtml('title');
var VID=qs('v'),INFO=null;
function onLang(){if(INFO)render();}
function go(v){location.href='passenger.html?v='+encodeURIComponent(v);}
function err(m){var e=$('err');e.textContent=m;e.classList.remove('hidden');}
function render(){
  $('plate').textContent=INFO.plate||INFO.vehicleId;$('route').textContent=INFO.route||'';
  var c=[];if(INFO.openTrip){c=['<span class="chip red">'+t('round')+': '+esc(INFO.openTrip.roundName)+'</span>','<span class="chip">'+t('driver')+': '+esc(INFO.openTrip.driverName)+'</span>','<span class="chip">'+t('start')+' '+esc(INFO.openTrip.startTime)+'</span>'];}
  $('chips').innerHTML=c.join('');
  $('liveRow').classList.toggle('hidden',!INFO.openTrip);$('warn').classList.toggle('hidden',!!INFO.openTrip);$('form').classList.toggle('hidden',!INFO.openTrip);
}
function board(){
  var e=$('emp').value.trim();if(!e){err(t('needEmp'));return;}
  $('err').classList.add('hidden');$('go').disabled=true;
  apiPost({action:'boarding',vehicleId:VID,employeeId:e}).then(function(r){
    $('go').disabled=false;
    if(!r.ok){err(r.error||'error');return;}
    try{localStorage.setItem('bc_emp',e);}catch(x){}
    showOk(t('okTitle'),[r.employeeName,INFO.plate+' · '+(INFO.openTrip?INFO.openTrip.roundName:''),t('time')+' '+r.time],t('okBtn'),function(){location.href='index.html';});
  }).catch(function(){$('go').disabled=false;err(t('errNet'));});
}
if(VID){
  apiGet({action:'vehicle',v:VID}).then(function(r){
    $('spin').classList.add('hidden');
    if(!r.ok){$('pick').classList.remove('hidden');toast(r.error||t('notFound'));loadList();return;}
    INFO=r;$('car').classList.remove('hidden');render();
    try{$('emp').value=localStorage.getItem('bc_emp')||'';}catch(x){}
  }).catch(function(){$('spin').textContent=t('errNet');});
}else{$('spin').classList.add('hidden');$('pick').classList.remove('hidden');loadList();}
function loadList(){apiGet({action:'meta'}).then(function(r){if(!r.ok)return;$('vlist').innerHTML=r.vehicles.map(function(v){return '<button onclick="go(\''+esc(v.id)+'\')"><b>'+esc(v.plate||v.id)+'</b> <span class="muted">'+esc(v.route)+'</span></button>';}).join('');});}
applyLang();</script></body></html>
